{{- if .Values.massdriver.serviceAccount.create -}}
# Service account for Argo's executor containers.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "massdriver.fullname" . }}-workflow-executor
  labels:
    {{- include "massdriver.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow
automountServiceAccountToken: false
---
# Argo looks up the executor's token in a Secret named
# <service account>.service-account-token.
apiVersion: v1
kind: Secret
type: kubernetes.io/service-account-token
metadata:
  name: {{ include "massdriver.fullname" . }}-workflow-executor.service-account-token
  labels:
    {{- include "massdriver.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow
  annotations:
    kubernetes.io/service-account.name: {{ include "massdriver.fullname" . }}-workflow-executor
{{- end }}
