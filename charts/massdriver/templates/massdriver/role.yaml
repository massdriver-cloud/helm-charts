apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "massdriver.fullname" . }}-massdriver
  labels:
    {{- include "massdriver.labels" . | nindent 4 }}
    app.kubernetes.io/component: massdriver
rules:
- apiGroups: ["argoproj.io"]
  resources: ["workflows"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
# Each workflow gets a Secret holding its sensitive inputs. The Secret is owned
# by the Workflow, so Kubernetes garbage-collects it; no delete is needed.
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["create"]