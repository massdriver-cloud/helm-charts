{{- with .Values.provisioner.identityTokens }}
{{- if and (not .existingSecret) .signingKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "massdriver.identityTokensSecretName" $ }}
  labels:
    {{- include "massdriver.labels" $ | nindent 4 }}
    app.kubernetes.io/component: massdriver
type: Opaque
data:
  signingKey: {{ .signingKey | b64enc }}
  {{- if .previousPublicKeys }}
  previousPublicKeys: {{ .previousPublicKeys | b64enc }}
  {{- end }}
{{- end }}
{{- end }}
