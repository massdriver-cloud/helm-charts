apiVersion: v1
kind: ConfigMap
metadata: 
  name: {{ include "massdriver.fullname" . }}-massdriver-envs
  labels:
    {{- include "massdriver.labels" . | nindent 4 }}
    app.kubernetes.io/component: massdriver
data:
  ALLOW_OIDC_EMAIL_ACCOUNT_LINKING: "true"
  BLOB_STORAGE_HOST: "{{ include "massdriver.fullname" . }}-s3proxy.{{ .Release.Namespace }}.svc"
  BLOB_STORAGE_PORT: "80"
  BLOB_STORAGE_SCHEME: http
  DATABASE_SSL: "true"
  FORCE_V2_LOGGING: "true"
  LOG_LEVEL: {{ .Values.massdriver.logLevel | quote }}
  {{- if .Values.massdriver.epmd.enabled }}
  MD_EPMD_CLUSTER_SERVICE: {{ include "massdriver.fullname" . }}-massdriver-epmd.{{ .Release.Namespace }}.svc
  {{- end }}
  MD_API_URL: {{ include "massdriver.protocol" . }}://{{ .Values.massdriver.apiSubdomain }}.{{ .Values.domain }}
  MD_DOCS_URL: {{ .Values.massdriver.docsUrl | default "https://docs.massdriver.cloud" | quote }}
  MD_FRONTEND_URL: {{ include "massdriver.protocol" . }}://{{ .Values.massdriver.appSubdomain }}.{{ .Values.domain }}
  MD_METRICS_SERVER_ENABLED: "{{ .Values.massdriver.metrics.enabled }}"
  MD_METRICS_SERVER_PORT: {{ .Values.massdriver.metrics.port | toString | quote }}
  MD_REPOSITORY_BUCKET: {{ .Values.massdriver.blobStorage.massdriverBucket }}
  MD_PROVISIONER_ARGO_NAMESPACE: {{ .Release.Namespace }}
  MD_PROVISIONER_EXIT_IMAGE: {{ .Values.provisioner.exitImage }}
  MD_PROVISIONER_INIT_IMAGE: {{ .Values.provisioner.initImage }}
  MD_PROVISIONER_LOGGER_IMAGE: {{ .Values.provisioner.loggerImage }}
  {{- if include "massdriver.identityTokensEnabled" . }}
  {{- with .Values.provisioner.identityTokens }}
  {{- if .issuer }}
  MD_PROVISIONER_OIDC_ISSUER: {{ .issuer | quote }}
  {{- end }}
  MD_PROVISIONER_OIDC_TOKEN_TTL_MINUTES: {{ .ttlMinutes | toString | quote }}
  {{- end }}
  {{- end }}
  MD_WORKFLOW_ARTIFACT_GC_SERVICE_ACCOUNT_NAME: {{ include "massdriver.artifactGCServiceAccountName" . }}
  MD_WORKFLOW_EXECUTOR_SERVICE_ACCOUNT_NAME: {{ include "massdriver.fullname" . }}-workflow-executor
  MD_PROVISIONER_SERVICE_ACCOUNT_NAME: {{ include "massdriver.fullname" . }}-provisioner
  MD_SESSION_TTL_HOURS: {{ .Values.massdriver.sessionTtlHours | toString | quote }}
  MIX_ENV: prod
  {{- if .Values.otel.enabled }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .Values.otel.resourceAttributes | quote }}
  OTEL_SERVICE_NAME: {{ .Values.otel.serviceName | quote }}
  {{- if eq .Values.otel.exporter "otlp" }}
  OTEL_TRACES_EXPORTER: otlp
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.otel.otlp.endpoint | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.otel.otlp.headers | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.otel.otlp.protocol | quote }}
  {{- end }}
  {{- end }}
  PHX_CHECK_ORIGIN: {{ include "massdriver.phxCheckOrigins" . }}
  PHX_CORS_ORIGINS: {{ include "massdriver.corsOrigins" . }}
  PHX_HTTP_PORT: {{ .Values.massdriver.port | toString | quote }}
  PHX_SERVER: "true"
  PHX_URL_HOST: {{ .Values.massdriver.apiSubdomain }}.{{ .Values.domain }}
  PHX_URL_PORT: "{{ if eq (include "massdriver.protocol" .) "https" }}443{{ else }}80{{ end }}"
  PHX_URL_SCHEME: {{ include "massdriver.protocol" . }}
  TERRAFORM_STATE_BUCKET_NAME: {{ .Values.massdriver.blobStorage.stateBucket }}
  {{- /* A key the operator already set in additionalEnvs is not rendered again, so the ConfigMap has no duplicate keys. */}}
  {{- $additionalEnvs := .Values.massdriver.additionalEnvs | default dict }}
  {{- if not (hasKey $additionalEnvs "POSTGRES_PORT") }}
  POSTGRES_PORT: {{ .Values.postgres.port | toString | quote }}
  {{- end }}
  {{- if and .Values.postgres.poolSize (not (hasKey $additionalEnvs "POSTGRES_POOL_SIZE")) }}
  POSTGRES_POOL_SIZE: {{ .Values.postgres.poolSize | toString | quote }}
  {{- end }}
  {{- with .Values.massdriver.concurrency }}
  {{- if and .environmentDeploys (not (hasKey $additionalEnvs "MD_ENVIRONMENT_DEPLOY_CONCURRENCY")) }}
  MD_ENVIRONMENT_DEPLOY_CONCURRENCY: {{ .environmentDeploys | toString | quote }}
  {{- end }}
  {{- if and .eventDeliveries (not (hasKey $additionalEnvs "MD_EVENT_DESTINATIONS_DELIVERY_CONCURRENCY")) }}
  MD_EVENT_DESTINATIONS_DELIVERY_CONCURRENCY: {{ .eventDeliveries | toString | quote }}
  {{- end }}
  {{- if and .integrationRuns (not (hasKey $additionalEnvs "MD_INTEGRATION_RUN_CONCURRENCY")) }}
  MD_INTEGRATION_RUN_CONCURRENCY: {{ .integrationRuns | toString | quote }}
  {{- end }}
  {{- if and .deploymentLogCompaction (not (hasKey $additionalEnvs "MD_DEPLOYMENT_LOG_COMPACTION_CONCURRENCY")) }}
  MD_DEPLOYMENT_LOG_COMPACTION_CONCURRENCY: {{ .deploymentLogCompaction | toString | quote }}
  {{- end }}
  {{- end }}
  {{- range $key, $value := .Values.massdriver.additionalEnvs }}
  {{ $key }}: {{ $value | toString | quote }}
  {{- end }}