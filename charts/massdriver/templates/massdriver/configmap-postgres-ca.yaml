{{- if .Values.postgres.ssl.caCert }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "massdriver.fullname" . }}-postgres-ca
  labels:
    {{- include "massdriver.labels" . | nindent 4 }}
    app.kubernetes.io/component: massdriver
data:
  ca.crt: |
    {{- .Values.postgres.ssl.caCert | nindent 4 }}
{{- end }}
