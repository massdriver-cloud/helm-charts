apiVersion: v2
name: massdriver
description: Helm chart for deploying Massdriver
type: application
version: 0.2.3
appVersion: 2.5.1

annotations:
  artifacthub.io/changes: |
    - kind: added
      description: "UI: the environment default and remote reference pickers show a grant-access badge, a same-environment flag, and a link to each resource."
    - kind: added
      description: "UI: version tooltips have a copy button and the deployment details dialog shows the full dev version tag."
    - kind: fixed
      description: "UI: a failed environment default swap restores the previous default and keeps the resource you picked selected."

dependencies:
  - name: argo-workflows
    condition: argo-workflows.enabled
    version: 0.47.5
    repository: https://argoproj.github.io/argo-helm
  - name: minio
    condition: minio.enabled
    version: 5.4.0
    repository: https://charts.min.io/
