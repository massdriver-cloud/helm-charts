apiVersion: v2
name: massdriver
description: Helm chart for deploying Massdriver
type: application
version: 0.3.1
appVersion: 2.6.0

annotations:
  artifacthub.io/changes: |
    - kind: added
      description: The Massdriver Role can create Secrets, so Massdriver can store each deployment's sensitive inputs in a Secret owned by its workflow.

dependencies:
  - name: argo-workflows
    condition: argo-workflows.enabled
    version: 0.47.5
    repository: https://argoproj.github.io/argo-helm
  # Vendored, unmodified copy of the upstream MinIO chart (see subcharts/minio/VENDORED.md)
  - name: minio
    condition: minio.enabled
    version: 5.4.0
    repository: file://subcharts/minio
