apiVersion: v2
name: massdriver
description: Helm chart for deploying Massdriver
type: application
version: 0.4.1
appVersion: 2.7.0

annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: postgres.port is passed to Massdriver as POSTGRES_PORT.
    - kind: added
      description: postgres.poolSize, queueTargetMs, queueIntervalMs, and timeoutMs set the database connection pool size, queue timing, and query timeout.
    - kind: added
      description: postgres.prepare can be set to unnamed for PgBouncer or RDS Proxy in transaction pooling mode.
    - kind: added
      description: postgres.ssl.verify turns on database certificate verification, and postgres.ssl.caCert sets the CA certificate to verify against.
    - kind: added
      description: massdriver.concurrency sets how many background jobs of each type a Massdriver pod runs at the same time.
    - kind: added
      description: massdriver.extraEnv adds Kubernetes-format environment variables, including valueFrom, to the Massdriver container and the migration job.

dependencies:
  - name: argo-workflows
    condition: argo-workflows.enabled
    version: 2.0.18
    repository: https://argoproj.github.io/argo-helm
  # Vendored, unmodified copy of the upstream MinIO chart (see subcharts/minio/VENDORED.md)
  - name: minio
    condition: minio.enabled
    version: 5.4.0
    repository: file://subcharts/minio
