apiVersion: v2
name: massdriver
description: Helm chart for deploying Massdriver
type: application
version: 0.2.7
appVersion: 2.5.5

annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: Update Massdriver to 2.5.5 and the UI to 2.1.6.
    - kind: changed
      description: Seats for SCIM users follow their active state in the identity provider, not group membership.
    - kind: added
      description: A SCIM integration can set a seat attribute and value so only matching users get a seat.
    - kind: changed
      description: SCIM sync is never refused at the seat limit; new users wait for a free seat.
    - kind: changed
      description: Access requires a seat, and pending invitations no longer hold one.
    - kind: added
      description: Integration settings can be changed without deleting and recreating the integration.
    - kind: fixed
      description: Changing a custom attribute no longer blocks updates to entities that carry an old value.
    - kind: changed
      description: Custom attribute changes that would break a policy, a grant, or the naming convention are refused.
    - kind: added
      description: "UI: the Members tab shows whether each member holds a seat and where they came from."
    - kind: added
      description: "UI: integrations can be edited, enabled, and disabled."
    - kind: added
      description: "UI: the Config options menu is always available and can load config from a past deployment or JSON, promote, compare, and discard changes."
    - kind: added
      description: "UI: glossary help for platform terms across the app."

dependencies:
  - name: argo-workflows
    condition: argo-workflows.enabled
    version: 0.47.5
    repository: https://argoproj.github.io/argo-helm
  # Vendored, unmodified copy of the upstream MinIO chart (see subcharts/minio/VENDORED.md)
  - name: minio
    condition: minio.enabled
    version: 5.4.0
    repository: file://subcharts/minio
