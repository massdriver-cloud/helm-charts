apiVersion: v2
name: massdriver
description: Helm chart for deploying Massdriver
type: application
version: 0.2.6
appVersion: 2.5.4

annotations:
  artifacthub.io/changes: |
    - kind: changed
      description: Update Massdriver to 2.5.4 and the UI to 2.1.5.
    - kind: changed
      description: Seats are held by members of one or more groups and by pending invitations, so a member in no group no longer holds a seat.
    - kind: fixed
      description: Resources can be looked up by their instance.field identifier in organizations with a custom naming convention.
    - kind: added
      description: "UI: the Groups and Members tabs show a seat meter, and the Billing tab shows seats used out of the total."
    - kind: changed
      description: "UI: new organizations see a book-a-call welcome dialog in place of the previous welcome dialog."

dependencies:
  - name: argo-workflows
    condition: argo-workflows.enabled
    version: 0.47.5
    repository: https://argoproj.github.io/argo-helm
  # Vendored, unmodified copy of the upstream MinIO chart (see subcharts/minio/VENDORED.md)
  - name: minio
    condition: minio.enabled
    version: 5.4.0
    repository: file://subcharts/minio
