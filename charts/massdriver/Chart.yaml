apiVersion: v2
name: massdriver
description: Helm chart for deploying Massdriver
type: application
version: 0.4.1
appVersion: 2.7.0

annotations:
  artifacthub.io/changes: |
    - kind: fixed
      description: postgres.port is passed to Massdriver as POSTGRES_PORT.
    - kind: added
      description: The optional postgres.poolSize value sets how many database connections each Massdriver pod holds open.
    - kind: added
      description: Optional massdriver.concurrency values set how many background jobs of each type a Massdriver pod runs at the same time.
    - kind: changed
      description: A key already set in massdriver.additionalEnvs is not set again by the chart.

dependencies:
  - name: argo-workflows
    condition: argo-workflows.enabled
    version: 2.0.18
    repository: https://argoproj.github.io/argo-helm
  # Vendored, unmodified copy of the upstream MinIO chart (see subcharts/minio/VENDORED.md)
  - name: minio
    condition: minio.enabled
    version: 5.4.0
    repository: file://subcharts/minio
